<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажери — каталог Edvault</title>
<meta name="description" content="Короткі рівні з підказками: від мишки й клавіатури до мереж і дизайну.">
<meta name="theme-color" content="#1c2869">
<link rel="icon" href="icons/trainers.ico" sizes="32x32">
<link rel="icon" href="icons/trainers.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/trainers-180.png">
<script>
// тема до першого малювання, щоб не блимало
(() => {
  let t = 'auto';
  try { t = localStorage.getItem('edvault-theme') || 'auto'; } catch (e) {}
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
<style>
@font-face { font-family: Rubik; font-weight: 300 900; font-display: swap; src: url(assets/fonts/rubik-cyr.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: Rubik; font-weight: 300 900; font-display: swap; src: url(assets/fonts/rubik-lat.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: 'Golos Text'; font-weight: 400 900; font-display: swap; src: url(assets/fonts/golos-cyr.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Golos Text'; font-weight: 400 900; font-display: swap; src: url(assets/fonts/golos-lat.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
:root{
  color-scheme:light;
  --bg:#dfe4ea;--surface:#fdfefb;--surface2:#f2f5f7;--surface3:#e8edf1;
  --border:#d9e0e7;--border2:#bfc9d4;
  --text:#1d2236;--text2:#454c63;--muted:#5d6478;
  --accent:#2337a8;--accent-hover:#1a2a8a;--accent-light:#e8ecfb;--accent-border:#b9c3ef;--on-accent:#fff;
  --shadow-sm:0 1px 2px rgba(28,40,105,.12);--shadow-md:0 8px 22px rgba(28,40,105,.12);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1e1e1e;--surface:#2c2c2c;--surface2:#383838;--surface3:#424242;
  --border:#3a3a3a;--border2:#4a4a4a;
  --text:#ededed;--text2:#c2c2c2;--muted:#9a9a9a;
  --accent:#9aabff;--accent-hover:#b3c0ff;--accent-light:rgba(154,171,255,.14);--accent-border:rgba(154,171,255,.38);--on-accent:#10153a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 8px 22px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.45 'Golos Text',system-ui,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;font:600 17px Rubik,sans-serif;letter-spacing:-.01em}
.brand img{width:30px;height:30px;border-radius:8px}
.grow{flex:1}
.ib{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--text2);background:none;border:0;cursor:pointer}
.ib:hover{background:var(--surface2);color:var(--text)}
.ib .sun{display:none}
:root[data-theme="dark"] .ib .sun{display:block}
:root[data-theme="dark"] .ib .moon{display:none}

.ct{max-width:860px;margin:0 auto;padding:28px 20px 48px}
.hd{margin-bottom:16px}
.hd h1{font:600 30px/1.15 Rubik,sans-serif;letter-spacing:-.015em;display:flex;align-items:baseline;gap:10px}
.hd h1 span{font-size:17px;font-weight:500;color:var(--muted)}
.hd p{margin-top:6px;color:var(--text2)}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.sbox{flex:1;min-width:240px;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.sbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.sbox input{flex:1;min-width:0;height:100%;border:0;background:none;font:inherit;color:var(--text);outline:0}
.sbox input::placeholder{color:var(--muted)}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox .ib{width:32px;height:32px}
.sbox .ib[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:7px 13px;border-radius:18px;border:1px solid var(--border);background:var(--surface);font:inherit;font-size:13.5px;color:var(--text2);cursor:pointer}
.chips button:hover{border-color:var(--border2);color:var(--text)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}

.list{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.gh{padding:10px 16px 7px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2);border-top:1px solid var(--border)}
.gh:first-child{border-top:0}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--border)}
.gh+.row,.list>.row:first-child{border-top:0}
.row img{width:40px;height:40px;border-radius:10px;flex:none}
.row div{flex:1;min-width:0}
.row b{display:flex;align-items:baseline;gap:8px;font-weight:600;font-size:15.5px}
.row b em{font-style:normal;font-weight:500;font-size:12.5px;color:var(--muted)}
.row small{display:block;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row mark{background:var(--accent-light);color:inherit;border-radius:3px}
.row .go{color:var(--muted);display:grid;transition:transform .15s}
.row:hover,.row:focus-visible{background:var(--accent-light)}
.row:focus-visible{outline-offset:-2px}
.row:hover .go{color:var(--accent);transform:translateX(2px)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.foot{margin-top:18px;text-align:center;font-size:13.5px;color:var(--muted)}
.foot a{color:var(--accent)}
.foot a:hover{text-decoration:underline}

@media(max-width:700px){
  .top{gap:6px;padding:0 10px}
        .ct{padding:18px 12px 36px}
  .hd h1{font-size:25px}
  .bar{flex-direction:column;flex-wrap:nowrap;align-items:stretch}
  .sbox{min-width:0;flex:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px;padding:0 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none}
  .row{padding:12px 14px;gap:12px}
  .row small{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}
@media(prefers-reduced-motion:reduce){.row .go{transition:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./"><img src="icons/trainers.svg" alt=""><span>Edvault</span></a>
  <span class="grow"></span>
  <button class="ib" type="button" data-theme-btn title="Тема" aria-label="Перемкнути тему">
    <svg class="i moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    <svg class="i sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
<main class="ct">
  <div class="hd">
    <h1>Тренажери <span>10</span></h1>
    <p>Короткі рівні з підказками: від мишки й клавіатури до мереж і дизайну.</p>
  </div>
  <div class="bar">
    <label class="sbox">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input type="search" data-q placeholder="Пошук: «друк», «паролі», «колір»…" aria-label="Пошук" autocomplete="off">
      <button class="ib" type="button" data-clear hidden aria-label="Очистити пошук"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </label>
    <div class="chips" data-chips role="group" aria-label="Категорії"></div>
  </div>
  <div class="list" data-list></div>
  <p class="foot"><a href="./">Про проєкт</a></p>
</main>
<script>
(() => {
  const CATS = [["basics", "Комп’ютерна грамотність"], ["code", "Програмування й ІТ"], ["design", "Дизайн"]];
  const ITEMS = [{"id": "mouse-trainer", "cat": "basics", "name": "Мишка й точність", "desc": "Клацання, перетягування, виділення рамкою й прокручування.", "lv": 24, "icon": "mouse-trainer"}, {"id": "files-trainer", "cat": "basics", "name": "Файли й папки", "desc": "Папки й шляхи, імена й розширення, кошик і пошук.", "lv": 24, "icon": "files-trainer"}, {"id": "safety-trainer", "cat": "basics", "name": "Безпека в інтернеті", "desc": "Адреси сайтів, фішинг, надійні паролі й особисті дані.", "lv": 20, "icon": "safety-trainer"}, {"id": "hotkeys-trainer", "cat": "basics", "name": "Гарячі клавіші", "desc": "Копіювати, вставити, скасувати й зберегти без мишки.", "lv": 20, "icon": "hotkeys-trainer"}, {"id": "typing-trainer", "cat": "basics", "name": "Сліпий друк", "desc": "Українська й англійська розкладки, від ряду до абзаців.", "lv": 51, "icon": "typing-trainer"}, {"id": "robot", "cat": "code", "name": "Алгоритми з роботом", "desc": "Команди, цикли й умови блоками-пазлами.", "lv": 24, "icon": "robot"}, {"id": "network-trainer", "cat": "code", "name": "Мережі", "desc": "Кабелі, IP-адреси, роутер, DNS, DHCP і ping.", "lv": 20, "icon": "network-trainer"}, {"id": "uiux-trainer", "cat": "design", "name": "UI/UX-дизайнер", "desc": "Знайти й виправити помилки дизайну екрана.", "lv": 20, "icon": "uiux-trainer"}, {"id": "pen-trainer", "cat": "design", "name": "Тренажер пера", "desc": "Перо як у Figma: від прямих ліній до літер.", "lv": 26, "icon": "pen-trainer"}, {"id": "color-trainer", "cat": "design", "name": "Колір на око", "desc": "Відтінок, насиченість, змішування світла й переходи.", "lv": 28, "icon": "color-trainer"}];
  const root = document.documentElement;
  const $ = s => document.querySelector(s);
  const list = $('[data-list]'), q = $('[data-q]'), chips = $('[data-chips]'), clear = $('[data-clear]');
  const meta = document.querySelector('meta[name="theme-color"]');
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const norm = s => s.toLowerCase().replace(/ё/g, 'е').replace(/[’'ʼ]/g, '');
  const lv = n => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? 'рівень' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'рівні' : 'рівнів');
  const arrow = '<span class="go" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
  let cat = '';

  // підсвічує знайдений фрагмент; пошук іде по нормалізованому тексту тієї ж довжини
  const hl = (text, term) => {
    if (!term) return esc(text);
    const i = norm(text).indexOf(term);
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length));
  };
  const row = (it, term) => `<a class="row" href="${it.id}"><img src="icons/${it.icon}.svg" alt="" width="40" height="40"><div><b>${hl(it.name, term)}${it.lv ? `<em>${lv(it.lv)}</em>` : ''}</b><small>${hl(it.desc, term)}</small></div>${arrow}</a>`;

  function render() {
    const term = norm(q.value.trim());
    clear.hidden = !q.value;
    const hit = it => (!cat || it.cat === cat) && (!term || norm(it.name + ' ' + it.desc).includes(term));
    let html = '';
    if (CATS.length) {
      for (const [id, name] of CATS) {
        const rows = ITEMS.filter(it => it.cat === id && hit(it));
        if (rows.length) html += `<div class="gh">${name}</div>` + rows.map(it => row(it, term)).join('');
      }
    } else {
      html = ITEMS.filter(hit).map(it => row(it, term)).join('');
    }
    list.innerHTML = html || '<p class="empty">Нічого не знайдено. Спробуйте інше слово.</p>';
  }

  if (CATS.length) {
    chips.innerHTML = [['', 'Усі'], ...CATS].map(([id, name]) => `<button type="button" data-cat="${id}" aria-pressed="${id === cat}">${name}</button>`).join('');
    chips.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      cat = b.dataset.cat;
      chips.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      render();
    });
  } else chips.remove();

  q.addEventListener('input', render);
  q.addEventListener('keydown', e => {
    if (e.key === 'Escape' && q.value) { q.value = ''; render(); }
    if (e.key === 'Enter') { const a = list.querySelector('.row'); if (a) location.href = a.href; }
  });
  clear.addEventListener('click', () => { q.value = ''; render(); q.focus(); });
  addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });

  // тема: light / dark / auto у localStorage['edvault-theme']
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const get = () => { try { return localStorage.getItem('edvault-theme') || 'auto'; } catch (e) { return 'auto'; } };
  const apply = () => {
    const t = get(), dark = t === 'dark' || (t === 'auto' && mq.matches);
    root.dataset.theme = dark ? 'dark' : 'light';
    meta.content = dark ? '#1e1e1e' : '#1c2869';
  };
  $('[data-theme-btn]').addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('edvault-theme', next); } catch (e) {}
    apply();
  });
  mq.addEventListener('change', apply);
  addEventListener('storage', e => { if (e.key === 'edvault-theme') apply(); });
  apply();
  render();
})();
</script>
</body>
</html>
